    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg1: #FCF8F2;
            --bg2: #EFE7DA;
            /* פלטת הלוגו: פחם, זהב-חול וקרם.
               --gold-deep הוא גרסה כהה של הזהב, לטקסט קטן שזקוק לניגודיות על לבן */
            --ink: #262321;
            --gold: #A98A62;
            --gold-deep: #8A6B45;
            --sand: #F0E8DB;
            --sand-line: #DDCFB8;
            --cream: #F5EFE6;
            --text: var(--ink);
            --muted: #8E8071;
            --green: #25D366;
        }

        body {
            font-family: 'Rubik', sans-serif;
            color: var(--text);
            background: var(--bg2);
            min-height: 100dvh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 26px 20px calc(26px + env(safe-area-inset-bottom));
        }

        /* ---- רקע: קולאז' מוצרים חד ---- */
        .bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }
        .bg-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 25%;
            width: 100%;
            height: 100%;
            /* טשטוש קל בלבד — מספיק כדי שכיתוב על אריזות לא יתחרה בכרטיס,
               ועדיין נמוך מספיק כדי שהמוצרים יישארו מזוהים */
            transform: scale(1.06);
            filter: blur(5px) saturate(1.1);
        }
        .bg-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* ויניאטה מכהה — נותנת עומק ומבליטה את הכרטיס בלי לטשטש את המוצרים */
        .bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(105% 75% at 50% 46%,
                    rgba(30, 20, 12, .34) 0%,
                    rgba(30, 20, 12, .74) 100%),
                linear-gradient(180deg,
                    rgba(48, 33, 20, .34) 0%,
                    rgba(48, 33, 20, .44) 100%);
        }
        @media (min-width: 700px) {
            .bg-grid { grid-template-columns: repeat(5, 1fr); grid-auto-rows: 34%; }
        }

        /* entrance */
        @keyframes rise {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .anim { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
        .d1 { animation-delay: .05s; }
        .d2 { animation-delay: .16s; }
        .d3 { animation-delay: .28s; }
        .d4 { animation-delay: .40s; }
        .d5 { animation-delay: .52s; }

        /* ---- הכרטיס ---- */
        .card {
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, .95);
            -webkit-backdrop-filter: blur(10px);
                    backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, .75);
            border-radius: 30px;
            padding: 30px 24px 26px;
            box-shadow:
                0 32px 70px rgba(35, 22, 10, .34),
                0 4px 14px rgba(35, 22, 10, .14);
        }

        /* ---- התג: גלולת חול קומפקטית. קווי הצד שמורים ל‑tagline שמחקה את הלוגו ---- */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--sand);
            border: 1px solid var(--sand-line);
            color: var(--gold-deep);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .3px;
            padding: 7px 15px;
            border-radius: 50px;
            margin-bottom: 18px;
        }
        .badge .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--gold);
            animation: live 2.2s infinite;
        }
        @keyframes live {
            0%   { box-shadow: 0 0 0 0 rgba(169,138,98,.55); }
            70%  { box-shadow: 0 0 0 7px rgba(169,138,98,0); }
            100% { box-shadow: 0 0 0 0 rgba(169,138,98,0); }
        }

        /* הלוגו נושא את שם המותג, ולכן הכותרת נושאת רק את ההבטחה */
        .logo {
            display: block;
            width: clamp(116px, 31vw, 146px);
            height: auto;
            margin: 0 auto 14px;
            border-radius: 50%;
            box-shadow: 0 8px 22px rgba(38, 35, 33, .15);
        }
        h1 {
            font-size: clamp(21px, 5.7vw, 26px);
            font-weight: 900;
            line-height: 1.3;
            color: var(--ink);
            letter-spacing: -0.4px;
            margin-bottom: 22px;
            text-wrap: balance;
        }
        h1 .hl { color: var(--gold-deep); }

        /* ---- שורות היתרון ---- */
        .benefits {
            display: grid;
            gap: 11px;
            text-align: right;
            margin-bottom: 24px;
            padding: 0 2px;
        }
        .benefit {
            display: flex;
            align-items: center;
            gap: 11px;
            font-size: clamp(14.5px, 3.9vw, 16px);
            font-weight: 600;
            color: #5B4E42;
            line-height: 1.4;
        }
        .benefit .ic {
            flex-shrink: 0;
            width: 27px; height: 27px;
            border-radius: 50%;
            background: var(--sand);
            border: 1px solid var(--sand-line);
            display: grid;
            place-items: center;
        }
        .benefit .ic svg { width: 13px; height: 13px; fill: var(--gold-deep); }
        /* ההדגשה נשענת על משקל וקו חול תחתון במקום על צבע צועק */
        .benefit strong {
            color: var(--text);
            font-weight: 800;
            background: linear-gradient(180deg, transparent 63%, rgba(169, 138, 98, .30) 63%);
        }

        /* ---- CTA ---- */
        .cta {
            display: inline-flex;
            align-items: center; justify-content: center;
            gap: 11px;
            width: 100%;
            background: var(--green);
            color: #fff;
            text-decoration: none;
            padding: 18px 24px;
            border-radius: 50px;
            font-size: clamp(17px, 4.6vw, 20px);
            font-weight: 900;
            border: none; cursor: pointer;
            box-shadow: 0 12px 26px rgba(37, 211, 102, .36);
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .cta:hover { transform: translateY(-3px); box-shadow: 0 16px 32px rgba(37, 211, 102, .44); }
        .cta:active { transform: translateY(0); }
        .cta svg { width: 24px; height: 24px; fill: #fff; flex-shrink: 0; }

        .proof { margin-top: 13px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
        .proof strong { color: var(--gold-deep); font-weight: 800; }

        /* ---- קרוסלה מתחת לכרטיס ---- */
        .carousel {
            width: 100vw;
            margin-inline: calc(50% - 50vw);
            margin-top: 30px;
            overflow: hidden;
            direction: ltr;      /* עוגן את הרצועה לשמאל — אחרת ב‑RTL היא נדחפת החוצה וה‑‎-50%‎ מרוקן את המסך */
            -webkit-mask: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
                    mask: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
        }
        .track {
            display: flex;
            width: max-content;
            will-change: transform;
            /* לולאה אינסופית: סט כפול + הזזה של בדיוק ‎-50%‎ = מעבר חלק בלי סוף */
            animation: scroll 34s linear infinite;
        }
        .slide { flex-shrink: 0; margin-right: 14px; }
        .slide img {
            width: 132px;
            height: 132px;
            object-fit: cover;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 12px 26px rgba(20, 12, 5, .38);
            border: 3px solid rgba(255, 255, 255, .92);
        }
        @keyframes scroll {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }

        @media (prefers-reduced-motion: reduce) {
            .track, .anim, .badge .dot { animation: none !important; }
            .anim { opacity: 1; }
            .cta { transition: none; }
            /* בלי אנימציה — הקרוסלה נגללת ידנית כדי שכל התמונות עדיין נגישות */
            .carousel {
                overflow-x: auto;
                -webkit-mask: none; mask: none;
                scroll-snap-type: x mandatory;
                -ms-overflow-style: none; scrollbar-width: none;
            }
            .carousel::-webkit-scrollbar { display: none; }
            .slide { scroll-snap-align: center; }
        }
    </style>
