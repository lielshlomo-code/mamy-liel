        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rubik', sans-serif;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #FFF0F3 0%, #FDE8EF 40%, #F5E6F0 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ---- רקע: מוזאיקת מוצרי תינוקות ---- */
        .mosaic {
            position: fixed;
            inset: -10%;
            z-index: 0;
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            transform: rotate(-6deg) scale(1.06);
            transform-origin: center;
            animation: drift 46s ease-in-out infinite alternate;
        }

        .mosaic img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 16px;
            background: #fff;
        }

        @keyframes drift {
            from { transform: rotate(-6deg) scale(1.06) translate3d(0, 0, 0); }
            to   { transform: rotate(-6deg) scale(1.12) translate3d(-14px, -22px, 0); }
        }

        /* שכבת הצללה ורודה שמשאירה את הכרטיס קריא */
        .scrim {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(ellipse 62% 48% at 50% 50%, rgba(255, 246, 249, 0.46) 0%, rgba(255, 240, 244, 0.22) 55%, rgba(250, 232, 240, 0.10) 100%),
                linear-gradient(160deg, rgba(255, 240, 243, 0.20) 0%, rgba(253, 232, 239, 0.16) 40%, rgba(245, 230, 240, 0.22) 100%);
            backdrop-filter: blur(2px) saturate(1.05);
            -webkit-backdrop-filter: blur(2px) saturate(1.05);
        }

        @media (min-width: 700px) {
            .mosaic { grid-template-columns: repeat(6, 1fr); }
        }

        @media (min-width: 1100px) {
            .mosaic { grid-template-columns: repeat(8, 1fr); }
        }

        @media (prefers-reduced-motion: reduce) {
            .mosaic { animation: none; }
            .cta-button { animation: none; }
        }

        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(24px) saturate(1.1);
            -webkit-backdrop-filter: blur(24px) saturate(1.1);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 32px;
            padding: 36px 32px 36px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 18px 60px rgba(180, 90, 120, 0.18);
        }

        /* ---- שבב AliExpress ---- */
        .ali-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #FF6A00 0%, #E62E04 100%);
            color: #fff;
            padding: 8px 16px 8px 14px;
            border-radius: 999px;
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1;
            box-shadow: 0 6px 18px rgba(230, 46, 4, 0.28);
            margin-bottom: 20px;
        }

        .ali-chip svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .ali-chip b {
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            line-height: 1.4;
            color: #2D2D2D;
            margin-bottom: 24px;
        }

        h1 .highlight {
            color: #E83E8C;
            display: inline;
        }

        .features {
            margin-bottom: 8px;
        }

        .feature {
            font-size: 15px;
            color: #555;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .feature strong {
            color: #E83E8C;
        }

        .question {
            font-size: 16px;
            color: #777;
            margin: 20px 0 24px;
            font-weight: 600;
        }

        .cta-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #25D366;
            color: white;
            text-decoration: none;
            padding: 18px 32px;
            border-radius: 50px;
            font-size: 19px;
            font-weight: 700;
            font-family: 'Rubik', sans-serif;
            box-shadow: 0 6px 24px rgba(37, 211, 102, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            animation: pulse 2s infinite, bounce 3s ease-in-out infinite;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(37, 211, 102, 0.45);
            animation-play-state: paused;
        }

        .cta-button svg {
            width: 24px;
            height: 24px;
            fill: white;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0% { box-shadow: 0 6px 24px rgba(37, 211, 102, 0.35); }
            50% { box-shadow: 0 6px 32px rgba(37, 211, 102, 0.55); }
            100% { box-shadow: 0 6px 24px rgba(37, 211, 102, 0.35); }
        }

        @keyframes bounce {
            0%, 50%, 100% { transform: translateY(0); }
            60% { transform: translateY(-9px); }
            72% { transform: translateY(0); }
            82% { transform: translateY(-5px); }
            90% { transform: translateY(0); }
        }

        .social-proof {
            margin-top: 16px;
            font-size: 13px;
            color: #888;
        }

        .social-proof strong {
            color: #555;
