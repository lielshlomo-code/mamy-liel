        body {

            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            animation: pulse 2s infinite, bounce 3s ease-in-out infinite;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(37, 211, 102, 0.45);
            animation-play-state: paused;
        }

        .cta-button svg {
            width: 24px;
            height: 24px;
            fill: white;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0% { box-shadow: 0 6px 24px rgba(37, 211, 102, 0.35); }
            50% { box-shadow: 0 6px 32px rgba(37, 211, 102, 0.55); }
            100% { box-shadow: 0 6px 24px rgba(37, 211, 102, 0.35); }
        }

        @keyframes bounce {
            0%, 50%, 100% { transform: translateY(0); }
            60% { transform: translateY(-9px); }
            72% { transform: translateY(0); }
            82% { transform: translateY(-5px); }
            90% { transform: translateY(0); }

    <script>
        // Track page view
        fetch('/api/track/landing', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ page: 'mivtzaim', event: 'view' })
        }).catch(function() {});

        document.getElementById('whatsapp-cta').addEventListener('click', function(e) {
            e.preventDefault();
            if (typeof fbq !== 'undefined') {
                fbq('track', 'Lead');

            // Track lead
            fetch('/api/track/landing', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },

            }).catch(function() {});
